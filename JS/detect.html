<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replace & Erase — Detect</title>
</head>

<body>

<script>
document.addEventListener("paste", event => {
  const clipboard = event.clipboardData;
  if (!clipboard) return;

  const picture = [...clipboard.items].find(item =>
    item.kind === "file" &&
    item.type.startsWith("image/")
  );

  if (picture) {
    document.dispatchEvent(
      new CustomEvent("paste:picture", {
        detail: picture.getAsFile()
      })
    );

    return;
  }

  const code = clipboard.getData("text/plain");

  if (code && code.trim()) {
    document.dispatchEvent(
      new CustomEvent("paste:code", {
        detail: code
      })
    );
  }
});
</script>

</body>
</html>
