<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reveal & Conceal</title>
<style>
* { box-sizing: border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#343638; font-family:Arial; }
#view { position:fixed; inset:0; overflow:hidden; touch-action:none; }
#page { position:absolute; left:50%; top:50%; transform-origin:center; }
#photo { display:block; max-width:none; user-select:none; -webkit-user-drag:none; }
#hint { position:fixed; bottom:20px; width:100%; padding:0 14px; text-align:center; color:#ccc; font-size:12px; pointer-events:none; }
</style>
</head>
<body>
<div id="view"><div id="page"><img id="photo" alt="Pasted photograph" hidden></div></div>

<div id="hint"></div>

<script>
const view=document.querySelector('#view'), page=document.querySelector('#page');
const photo=document.querySelector('#photo');
const hint=document.querySelector('#hint');
const fingers=new Map();
let scale=1,x=0,y=0,lastCenter=null,lastDistance=0,photoURL;
function render(){page.style.transform=`translate(-50%,-50%) translate(${x}px,${y}px) scale(${scale})`;}
async function showPhoto(blob){
  const url=URL.createObjectURL(blob), img=new Image();
  try {
    img.src=url; await img.decode();
    // JPEG keeps the source pixel dimensions but recompresses image data.
    const canvas=document.createElement('canvas');
    canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
    const ctx=canvas.getContext('2d');
    if(!ctx) throw Error('Image conversion unavailable');
    ctx.fillStyle='#fff'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);
    const jpeg=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92));
    if(!jpeg) throw Error('JPEG conversion failed');
    const nextURL=URL.createObjectURL(jpeg);
    photo.onload=()=>{
      if(photoURL) URL.revokeObjectURL(photoURL);
      photoURL=nextURL; photo.hidden=false;
      hint.textContent='Pinch to zoom • Drag to move';
      scale=Math.min(1,innerWidth/photo.naturalWidth,innerHeight/photo.naturalHeight);
      x=y=0; render();
    };
    photo.onerror=()=>{URL.revokeObjectURL(nextURL); hint.textContent='Could not display JPEG.';};
    photo.src=nextURL;
  } finally { URL.revokeObjectURL(url); }
}
function measure(){
  const p=[...fingers.values()];
  const center={x:p.reduce((s,v)=>s+v.x,0)/p.length,y:p.reduce((s,v)=>s+v.y,0)/p.length};
  const distance=p.length<2?0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
  return {center,distance};
}
view.onpointerdown=e=>{
  if(photo.hidden)return;
  view.setPointerCapture(e.pointerId);
  fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const m=measure();lastCenter=m.center;lastDistance=m.distance;
};
view.onpointermove=e=>{
  if(!fingers.has(e.pointerId))return;
  fingers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const m=measure();x+=m.center.x-lastCenter.x;y+=m.center.y-lastCenter.y;
  if(m.distance&&lastDistance){
    const next=Math.max(.02,Math.min(20,scale*m.distance/lastDistance));
    const cx=m.center.x-innerWidth/2-x,cy=m.center.y-innerHeight/2-y;
    x+=cx*(1-next/scale);y+=cy*(1-next/scale);scale=next;
  }
  lastCenter=m.center;lastDistance=m.distance;render();
};
function release(e){
  fingers.delete(e.pointerId);
  const m=fingers.size?measure():null;
  lastCenter=m?.center??null;lastDistance=m?.distance??0;
}
view.onpointerup=view.onpointercancel=release;
</script>
</body>
</html>
