<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Replace &amp; Erase</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
}

body {
  display: grid;
  place-items: center;
  background: #343638;
  font-family: Arial, Helvetica, sans-serif;
}

.wrap {
  width: min(96vw, 760px);
  display: grid;
  justify-items: center;
  gap: 14px;
}

.canvas {
  position: relative;
  width: 100%;
  aspect-ratio: 2 / 1;
  overflow: hidden;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: #000;
  border: 4px solid #171819;
  border-radius: 9px;
  -webkit-user-select: none;
  user-select: none;
}

.side {
  position: relative;
  overflow: hidden;
  touch-action: none;
}

.side + .side {
  border-left: 3px solid #343638;
}

.side-title {
  position: absolute;
  top: 10px;
  left: 12px;
  z-index: 20;
  color: rgba(255, 255, 255, 0.65);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: .12em;
  text-transform: uppercase;
  pointer-events: none;
}

.shape {
  position: absolute;
  border: 3px solid rgba(255,255,255,.92);
  background: rgba(255,255,255,.22);
  pointer-events: none;
}

.shape.circle {
  border-radius: 50%;
}

.shape.triangle {
  border: none;
  background: rgba(255,255,255,.92);
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}

.shape.triangle::after {
  content: "";
  position: absolute;
  left: 4px;
  right: 4px;
  top: 5px;
  bottom: 4px;
  background: rgba(255,255,255,.22);
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}

.preview {
  position: absolute;
  display: none;
  border: 3px dashed #fff;
  background: rgba(255,255,255,.18);
  pointer-events: none;
}

.preview.circle {
  border-radius: 50%;
}

.preview.triangle {
  border: none;
  background: rgba(255,255,255,.35);
  clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
}

.controls {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.shape-button {
  min-width: 100px;
  min-height: 46px;
  padding: 9px 16px;
  border: 2px solid #fff;
  border-radius: 6px;
  color: #161718;
  background: #deded7;
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
  box-shadow: 0 4px 0 rgba(0,0,0,.65);
  -webkit-tap-highlight-color: transparent;
}

.shape-button.active {
  color: #fff;
  background: #161718;
  transform: translateY(3px);
  box-shadow: 0 1px 0 rgba(0,0,0,.65);
}

@media (max-width: 600px) {
  .canvas {
    aspect-ratio: 1 / 1;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1fr;
  }

  .side + .side {
    border-left: none;
    border-top: 3px solid #343638;
  }
}
</style>
</head>

<body>

<div class="wrap">

  <div class="canvas">

    <div class="side" data-mode="replace">

      <div class="side-title">
        Replace
      </div>

      <div class="preview"></div>

    </div>

    <div class="side" data-mode="erase">

      <div class="side-title">
        Erase
      </div>

      <div class="preview"></div>

    </div>

  </div>

  <div class="controls">

    <button
      class="shape-button active"
      data-shape="square"
      type="button"
    >
      Square
    </button>

    <button
      class="shape-button"
      data-shape="circle"
      type="button"
    >
      Circle
    </button>

    <button
      class="shape-button"
      data-shape="triangle"
      type="button"
    >
      Triangle
    </button>

  </div>

</div>

</body>
</html>
