
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Replace & Erase — White Background</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#17151c;color:#f4e9db;font:16px system-ui;padding:20px}
main{max-width:850px;margin:auto}
h1{font-size:25px}
label{display:block;margin:18px 0 8px}
input[type=range]{width:100%;accent-color:#b76aeb}
.preview{margin-top:20px;min-height:220px;display:grid;place-items:center;overflow:hidden;border-radius:12px;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}
canvas{display:block;max-width:100%;height:auto}
button{margin-top:18px;padding:12px 18px;border:0;border-radius:8px;background:#b76aeb;color:white;font:inherit;font-weight:700}
button:disabled{opacity:.4}
small{color:#c6b8c9}
</style>
</head>
<body>
<main>
<h1>Replace & Erase — White Background</h1>

<label for="file">Choose image</label>
<input id="file" type="file" accept="image/*">

<label for="tolerance">
Background brightness:
<output id="value">245</output>
</label>
<input id="tolerance" type="range" min="0" max="255" value="245" step="1">

<small>
Move left to remove darker background shades.
Strongly colored paint is protected.
</small>

<div class="preview">
<canvas id="canvas"></canvas>
</div>

<button id="save" disabled>Save transparent PNG</button>
</main>

<script>
const file=document.querySelector('#file');
const slider=document.querySelector('#tolerance');
const value=document.querySelector('#value');
const canvas=document.querySelector('#canvas');
const save=document.querySelector('#save');
const ctx=canvas.getContext('2d',{willReadFrequently:true});

let original=null;

function update(){
  value.value=slider.value;
  if(!original)return;

  const data=new ImageData(
    new Uint8ClampedArray(original.data),
    original.width,
    original.height
  );

  const p=data.data;
  const t=+slider.value;

  for(let i=0;i<p.length;i+=4){
    const r=p[i],g=p[i+1],b=p[i+2];
    const low=Math.min(r,g,b);
    const high=Math.max(r,g,b);
    const saturation=high-low;

    if(saturation<55){
      const softness=35;
      const strength=Math.max(
        0,
        Math.min(1,(low-t)/softness)
      );

      p[i+3]=Math.round(
        p[i+3]*(1-strength)
      );
    }
  }

  ctx.putImageData(data,0,0);
}

file.addEventListener('change',()=>{
  const f=file.files[0];
  if(!f)return;

  const url=URL.createObjectURL(f);
  const img=new Image();

  img.onload=()=>{
    canvas.width=img.naturalWidth;
    canvas.height=img.naturalHeight;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img,0,0);

    original=ctx.getImageData(
      0,0,canvas.width,canvas.height
    );

    URL.revokeObjectURL(url);
    save.disabled=false;
    update();
  };

  img.onerror=()=>{
    URL.revokeObjectURL(url);
    alert('Could not open image.');
  };

  img.src=url;
});

slider.addEventListener('input',update);

save.addEventListener('click',()=>{
  canvas.toBlob(blob=>{
    if(!blob)return;

    const a=document.createElement('a');
    const url=URL.createObjectURL(blob);

    a.href=url;
    a.download='transparent.png';
    a.click();

    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
});
</script>
</body>
</html>
