<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>The Parts</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  background: #343638;
  font-family: Arial, Helvetica, sans-serif;
  color: white;
}

/* THE PARTS BUTTON */

.parts-open {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  padding: 11px 16px;

  border: 0;
  border-radius: 8px;

  background: #76563b;
  color: white;

  font-size: 15px;
  cursor: pointer;
}

/* LIGHTBOX */

.lightbox {
  position: fixed;
  inset: 0;

  display: none;
  align-items: center;
  justify-content: center;

  padding: 18px;

  background: rgba(0, 0, 0, .78);
}

.lightbox.open {
  display: flex;
}

.panel {
  position: relative;

  width: min(430px, 100%);
  max-height: 90vh;
  overflow-y: auto;

  padding: 22px;

  border-radius: 16px;

  background: #202224;
}

/* CLOSE */

.close {
  position: absolute;
  top: 12px;
  right: 14px;

  border: 0;
  background: transparent;
  color: #aaa;

  font-size: 25px;
  cursor: pointer;
}

h2 {
  margin: 0 0 18px;
  font-size: 20px;
}

/* PART BUTTONS */

.parts {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.part {
  padding: 10px 14px;

  border: 2px solid transparent;
  border-radius: 8px;

  background: #76563b;
  color: white;

  font-size: 14px;
  cursor: pointer;
}

.part.selected {
  border-color: white;
}

/* PREVIEW */

.preview-label {
  margin-top: 24px;
  margin-bottom: 8px;

  font-size: 12px;
  color: #999;
}

.preview {
  height: 180px;

  overflow: hidden;

  border: 1px solid #444;
  border-radius: 12px;

  background: white;
}

.preview iframe {
  display: block;

  width: 100%;
  height: 100%;

  border: 0;

  background: white;
}

/* RENAME */

.rename-wrap {
  margin-top: 18px;
}

.rename-wrap label {
  display: block;

  margin-bottom: 7px;

  font-size: 12px;
  color: #999;
}

.rename {
  width: 100%;

  padding: 11px 12px;

  border: 1px solid #555;
  border-radius: 8px;

  outline: none;

  background: #151617;
  color: white;

  font-size: 16px;
}

.rename:focus {
  border-color: #aaa;
}
</style>
</head>

<body>

<button class="parts-open" id="openParts">
  the parts
</button>

<div class="lightbox" id="lightbox">

  <div class="panel">

    <button class="close" id="closeParts">
      ×
    </button>

    <h2>the parts</h2>

    <div class="parts">

      <button
        class="part selected"
        data-part="square"
      >
        Square
      </button>

      <button
        class="part"
        data-part="circle"
      >
        Circle
      </button>

      <button
        class="part"
        data-part="line"
      >
        Line
      </button>

    </div>

    <div class="preview-label">
      selected part
    </div>

    <div class="preview">

      <!--
        Intentionally NO sandbox permissions.

        No scripts.
        No forms.
        No navigation permissions.
        No same-origin access.
      -->

      <iframe
        id="preview"
        sandbox=""
        referrerpolicy="no-referrer"
        title="Part preview"
      ></iframe>

    </div>

    <div class="rename-wrap">

      <label for="rename">
        rename part
      </label>

      <input
        class="rename"
        id="rename"
        value="Square"
        autocomplete="off"
        maxlength="80"
      >

    </div>

  </div>

</div>

<script>

const openButton =
  document.getElementById("openParts");

const closeButton =
  document.getElementById("closeParts");

const lightbox =
  document.getElementById("lightbox");

const preview =
  document.getElementById("preview");

const rename =
  document.getElementById("rename");

const partButtons =
  document.querySelectorAll(".part");

let selectedButton =
  document.querySelector(".part.selected");


/*
  SAMPLE PARTS

  Later these can be generated from Replace.

  Notice that we're storing only the small
  visual definition needed for the preview.
*/

const parts = {

  square: {
    html: `<div class="square"></div>`,

    css: `
      .square {
        width: 70px;
        height: 70px;
        background: #76563b;
      }
    `
  },

  circle: {
    html: `<div class="circle"></div>`,

    css: `
      .circle {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #76563b;
      }
    `
  },

  line: {
    html: `<div class="line"></div>`,

    css: `
      .line {
        width: 110px;
        height: 6px;
        border-radius: 20px;
        background: #76563b;
      }
    `
  }

};


/*
  BASIC SAFETY CHECK

  This prototype intentionally accepts
  only a tiny visual HTML subset.

  When Replace eventually feeds real Parts
  into this, this layer can become stricter.
*/

function cleanHTML(html) {

  const template =
    document.createElement("template");

  template.innerHTML = html;

  const blocked =
    template.content.querySelectorAll(
      "script, iframe, object, embed, form, link, meta, base, audio, video"
    );

  blocked.forEach(element => {
    element.remove();
  });


  const allElements =
    template.content.querySelectorAll("*");

  allElements.forEach(element => {

    [...element.attributes].forEach(attribute => {

      const name =
        attribute.name.toLowerCase();

      const value =
        attribute.value.trim().toLowerCase();


      /* REMOVE EVENT HANDLERS */

      if (name.startsWith("on")) {
        element.removeAttribute(attribute.name);
        return;
      }


      /* REMOVE EXTERNAL RESOURCE ATTRIBUTES */

      if (
        name === "src" ||
        name === "href" ||
        name === "srcset" ||
        name === "action" ||
        name === "formaction"
      ) {
        element.removeAttribute(attribute.name);
        return;
      }


      /* REMOVE JAVASCRIPT URLS */

      if (value.startsWith("javascript:")) {
        element.removeAttribute(attribute.name);
      }

    });

  });


  return template.innerHTML;
}


/*
  CSS SAFETY

  For this prototype, external URL loading,
  imports, and browser navigation tricks
  are removed.
*/

function cleanCSS(css) {

  let safe =
    String(css);


  /* REMOVE @IMPORT */

  safe =
    safe.replace(
      /@import[\s\S]*?;/gi,
      ""
    );


  /* REMOVE URL() */

  safe =
    safe.replace(
      /url\s*\([^)]*\)/gi,
      "none"
    );


  /* REMOVE @NAMESPACE */

  safe =
    safe.replace(
      /@namespace[\s\S]*?;/gi,
      ""
    );


  /*
    LIMIT HOW MUCH CSS CAN BE
    PUSHED INTO THE PREVIEW.
  */

  safe =
    safe.slice(0, 20000);


  return safe;
}


/*
  RENDER ONLY THE SELECTED PART

  The iframe receives a tiny isolated
  HTML document.

  No JavaScript is included.
*/

function renderPart(type) {

  const part =
    parts[type];

  if (!part) {
    preview.srcdoc = "";
    return;
  }


  const safeHTML =
    cleanHTML(part.html);

  const safeCSS =
    cleanCSS(part.css);


  const documentHTML = `
<!doctype html>

<html>

<head>

<meta charset="UTF-8">

<meta
  http-equiv="Content-Security-Policy"
  content="
    default-src 'none';
    img-src 'none';
    media-src 'none';
    font-src 'none';
    connect-src 'none';
    frame-src 'none';
    object-src 'none';
    form-action 'none';
    base-uri 'none';
    script-src 'none';
    style-src 'unsafe-inline';
  "
>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
}

body {
  display: grid;
  place-items: center;

  overflow: hidden;

  background: white;
}

${safeCSS}

</style>

</head>

<body>

${safeHTML}

</body>

</html>
  `;


  preview.srcdoc =
    documentHTML;
}


/* OPEN */

openButton.addEventListener("click", () => {

  lightbox.classList.add("open");

  renderPart(
    selectedButton.dataset.part
  );

});


/* CLOSE */

closeButton.addEventListener("click", () => {
  lightbox.classList.remove("open");
});


/* SELECT PART */

partButtons.forEach(button => {

  button.addEventListener("click", () => {

    partButtons.forEach(part => {
      part.classList.remove("selected");
    });

    button.classList.add("selected");

    selectedButton =
      button;

    const type =
      button.dataset.part;

    renderPart(type);

    rename.value =
      button.textContent.trim();

  });

});


/* RENAME */

rename.addEventListener("input", () => {

  if (!selectedButton) return;

  const name =
    rename.value.trim();

  selectedButton.textContent =
    name || "Unnamed";

});

</script>

</body>
</html>
