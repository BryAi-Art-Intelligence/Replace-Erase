
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>rename & arrange</title>

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      background: #343638;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .feathered-image {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;

      /* Top and bottom only */

      -webkit-mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 3%,
        black 97%,
        transparent 100%
      );

      mask-image: linear-gradient(
        to bottom,
        transparent 0%,
        black 3%,
        black 97%,
        transparent 100%
      );
    }

  </style>

</head>

<body>

  <img
    src="rename/B8B0FA32-0038-42DE-9A1F-9B4E9AA0A0C0.png"
    class="feathered-image"
    alt="rename & arrange"
  >

</body>

</html>
