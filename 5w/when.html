
<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Replace & Erase — Plum</title>

<style>

/* =========================
   BASE
   ========================= */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  min-height: 100svh;

  display: grid;
  place-items: center;

  background: #1c1a14;

  font-family: Arial, sans-serif;
}

/* =========================
   PLAQUE AREA
   ========================= */

.gold {
  width: 100%;
  min-height: 100svh;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 40px 4%;
}

/* =========================
   SVG
   ========================= */

.art {
  display: block;

  width: 100%;
  max-width: 1050px;

  height: auto;

  overflow: visible;
}

/* =========================
   LETTERING
   ========================= */

.lettering {
  font-family: Arial, sans-serif;

  font-size: 43px;
  font-weight: 600;

  letter-spacing: -1px;

  fill: #a56b91;
}

/* BOTTOM PLAQUE — FIRST LINE */

.slightly-smaller {
  font-size: 41px;
}

</style>
</head>

<body>

<main class="gold">

<svg
  class="art"
  viewBox="0 0 1050 500"
  aria-label="Replace and Erase information"
>

<!-- =========================
     FIRST PLAQUE
     ========================= -->

<g transform="translate(0 30)">

  <!-- DEEP PLUM OUTLINE -->

  <rect
    x="7"
    y="7"
    width="1036"
    height="166"
    fill="none"
    stroke="#572747"
    stroke-width="14"
  />

  <!-- LIGHT PLUM INNER EDGE -->

  <rect
    x="17"
    y="17"
    width="1016"
    height="146"
    fill="none"
    stroke="#a56b91"
    stroke-width="3"
  />

  <!-- WRITING -->

  <g class="lettering">

    <text
      x="30"
      y="71"
      textLength="990"
      lengthAdjust="spacingAndGlyphs"
    >when using a.i. to make and edit pictures,</text>

    <text
      x="30"
      y="129"
      textLength="990"
      lengthAdjust="spacingAndGlyphs"
    >replace &amp; erase can help reduce your use.</text>

  </g>

</g>

<!-- =========================
     SECOND PLAQUE
     ========================= -->

<g transform="translate(0 290)">

  <!-- DEEP PLUM OUTLINE -->

  <rect
    x="7"
    y="7"
    width="1036"
    height="166"
    fill="none"
    stroke="#572747"
    stroke-width="14"
  />

  <!-- LIGHT PLUM INNER EDGE -->

  <rect
    x="17"
    y="17"
    width="1016"
    height="146"
    fill="none"
    stroke="#a56b91"
    stroke-width="3"
  />

  <!-- WRITING -->

  <g class="lettering">

    <text
      class="slightly-smaller"
      x="30"
      y="71"
      textLength="990"
      lengthAdjust="spacingAndGlyphs"
    >watch the video to learn how replacing and</text>

    <text
      x="32"
      y="129"
      textLength="994"
      lengthAdjust="spacingAndGlyphs"
    >erasing pictures can help reduce your use.</text>

  </g>

</g>

</svg>

</main>

</body>
</html>
