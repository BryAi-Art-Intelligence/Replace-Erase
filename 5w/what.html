<!doctype html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Coding & Pictures</title>

<style>

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
}

body{
  display:grid;
  place-items:center;

  background:#f4f4f1;
  overflow:hidden;
}

svg{
  width:97%;
  height:auto;
  overflow:visible;
}


/* =========================
   TYPE
   ========================= */

.word{
  font-family:
    "Arial Rounded MT Bold",
    "Trebuchet MS",
    sans-serif;

  font-weight:900;
  font-size:100px;

  stroke-linejoin:round;
  stroke-linecap:round;

  transform:
    rotate(-1deg)
    scale(1.01,1.08);

  transform-origin:600px 125px;
}


/* =========================
   ORANGE OUTER STROKE
   ========================= */

.outline{
  fill:none;

  stroke:#f28c28;
  stroke-width:30;

  paint-order:stroke;
}


/* =========================
   ZEBRA LETTERS
   ========================= */

.zebra-type{
  fill:url(#zebraPattern);

  stroke:#050505;
  stroke-width:16;

  paint-order:stroke fill;
}
  .what-bubble{
  display:block;
  width:90%;
  max-width:900px;
  height:auto;
  margin:40px auto 0;
}

</style>
</head>


<body>

<svg
  viewBox="0 0 1200 250"
  role="img"
  aria-label="Coding and Pictures"
>


  <defs>

    <!-- =====================
         ZEBRA PATTERN

         patternUnits objectBoundingBox
         means every LETTER receives
         its own repeating pattern.
         ===================== -->

    <pattern
      id="zebraPattern"
      width=".34"
      height=".34"
      patternUnits="objectBoundingBox"
      patternContentUnits="objectBoundingBox"
    >

      <!-- BLACK BASE -->

      <rect
        x="0"
        y="0"
        width="1"
        height="1"
        fill="#050505"
      />


      <!-- WHITE ZEBRA STRIPE 1 -->

      <path
        d="
          M -.10 -.05
          C .00 .02,
            .08 .15,
            .12 .30

          C .16 .46,
            .12 .62,
            .20 .78

          C .24 .88,
            .30 .95,
            .36 1.08

          L .52 1.08

          C .43 .90,
            .38 .78,
            .37 .64

          C .36 .47,
            .43 .34,
            .37 .18

          C .33 .08,
            .28 .00,
            .24 -.05

          Z
        "
        fill="#fff"
      />


      <!-- WHITE ZEBRA STRIPE 2 -->

      <path
        d="
          M .58 -.06

          C .64 .10,
            .72 .19,
            .69 .34

          C .66 .49,
            .58 .60,
            .63 .74

          C .67 .86,
            .76 .95,
            .80 1.08

          L .97 1.08

          C .91 .91,
            .83 .78,
            .85 .63

          C .87 .47,
            .96 .36,
            .92 .20

          C .89 .09,
            .82 .00,
            .78 -.06

          Z
        "
        fill="#fff"
      />

    </pattern>

  </defs>



  <!-- =====================
       ORANGE OUTLINE
       ===================== -->

  <text
    class="word outline"
    x="600"
    y="165"
    text-anchor="middle">

    CODING&#160;&#160;&amp;&#160;&#160;PICTURES

  </text>



  <!-- =====================
       ZEBRA LETTERS
       ===================== -->

  <text
    class="word zebra-type"
    x="600"
    y="165"
    text-anchor="middle">

    CODING&#160;&#160;&amp;&#160;&#160;PICTURES

  </text>


</svg>
<img
  src="5w/0E45F544-4822-4D61-8550-C8D7E4308A17.png"
  alt="Replacing & Erasing pics & codes. Learning from your own creations. Conserving personal compute use. That’s what Replace & Erase is for."
  class="what-bubble"
>
</body>
</html>
