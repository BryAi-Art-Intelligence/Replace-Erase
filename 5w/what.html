<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Code & Pix</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background:#f4f4f1;
}

svg{
  width:min(88vw,620px);
  overflow:visible;
}


/* FAT INFLATED TYPE */

.bubble{
  font-family:
    "Arial Rounded MT Bold",
    "Trebuchet MS",
    sans-serif;

  font-weight:900;

  fill:#050505;
  stroke:#050505;
  stroke-width:19;

  stroke-linejoin:round;
  stroke-linecap:round;

  paint-order:stroke fill;
}


/* CODE */

.code{
  font-size:155px;

  transform:rotate(-1.5deg)
            scale(1.03,1.08);

  transform-origin:300px 130px;
}


/* & PIX */

.pix{
  font-size:150px;

  transform:rotate(1.5deg)
            scale(1.04,1.08);

  transform-origin:300px 310px;
}


/* GLOSS */

.gloss{
  fill:none;
  stroke:#fff;
  stroke-linecap:round;
  opacity:.88;
}

.big{
  stroke-width:10;
}

.small{
  stroke-width:5;
  opacity:.55;
}

.glow{
  fill:#fff;
  opacity:.28;
}


/* EXTRA CURVE LIGHT */

.curve-light{
  stroke-width:6;
  opacity:.42;
}

.micro-light{
  stroke-width:4;
  opacity:.68;
}

</style>
</head>
