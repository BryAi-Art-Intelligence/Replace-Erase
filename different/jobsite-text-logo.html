<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOBSITE website</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .jobsite-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .jobsite-text,
    .website-text {
      display: inline-block;

      background: linear-gradient(
        90deg,
        #64152f 0%,
        #70182f 35%,
        #6b172f 65%,
        #581229 100%
      );

      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;

      font-family: Arial Black, Impact, sans-serif;
      font-size: 56px;
      font-weight: 1000;
      letter-spacing: 1px;
      line-height: 1;
      white-space: nowrap;
    }

    .jobsite-text {
      transform: skewX(-16deg) scaleX(1.15) scaleY(1.35);
    }

    .website-text {
      transform: skewX(16deg) scaleX(1.15) scaleY(1.35);
    }
  </style>
</head>

<body>
  <div class="jobsite-logo" aria-label="JOBSITE website">
    <span class="jobsite-text">JOBSITE</span>
    <span class="website-text">website</span>
  </div>
</body>
</html>
