<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOBSITE Button</title>

  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: 30px;
      box-sizing: border-box;
    }

    .jobsite-button {
      width: 260px;
      height: 105px;
      overflow: hidden;
      padding: 0;

      background: white;
      border: none;
      outline: 4px solid #74436f;
      outline-offset: 4px;
      border-radius: 8px;
      cursor: pointer;
    }

    .jobsite-button span {
      display: block;

      color: #ffd83d;
      -webkit-text-stroke: 4px #563524;
      paint-order: stroke fill;

      font-family: Arial Black, Impact, sans-serif;
      font-size: 48px;
      font-weight: 1000;
      letter-spacing: -3px;
      line-height: 1;
      white-space: nowrap;

      transform: skewX(-16deg) scaleX(1.25) scaleY(1.65);
    }
  </style>
</head>

<body>
  <button class="jobsite-button" type="button">
    <span>JOBSITE</span>
  </button>
</body>
</html>
